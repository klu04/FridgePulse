services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    entrypoint: ["sh", "-c"]
    command:
      - >
        uv run ./prestart.sh &&
        exec uv run uvicorn app.main:app --reload --reload-dir app --host 0.0.0.0 --port 8000

  frontend:
    build:
      target: build
      args:
        VITE_API_BASE_URL: ""
    environment:
      CI: "true"
    command: sh -c "pnpm install --frozen-lockfile && pnpm run dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
