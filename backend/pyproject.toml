description = "Backend of FridgePulse"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "coverage==7.13.5",
    "fastapi-cloud-cli>=0.26.0",
    "fastapi[standard]==0.135.3",
    "greenlet==3.5.1",
    "httpx==0.28.1",
    "pwdlib[argon2]==0.3.0",
    "pydantic-settings==2.14.0",
    "pyjwt==2.12.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.10",
    "sqlalchemy==2.0.49",
    "tenacity==9.1.4",
]

[tool.fastapi]
entrypoint = "app.main:app"
